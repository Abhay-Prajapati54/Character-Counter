<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character-Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Real Time Char Counter</h2>
        <textarea name="text" id="text" class="text" placeholder="Please write your text here..." maxlength="50"></textarea>

       <div class="new">
        <p>Total Character :
            <span class="totalchar" id="totalchar"></span>
        </p>
        <p>Remaining Character :
            <span class="Remaining" id="Remaining"></span>
        </p>
       </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
